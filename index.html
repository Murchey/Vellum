<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>写作 · 小说模式</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div>
        <p class="eyebrow">Vellum 写作</p>
        <h1>小说模式</h1>
        <p class="sub">一键排版当前文稿：段首两格缩进 · 段落之间自动加空行</p>
      </div>
      <div class="head-actions">
        <button id="btn-novel" class="btn primary" type="button">套用小说模式</button>
        <button id="btn-reset" class="btn ghost" type="button">恢复原文</button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-bar">
        <span class="chip" id="stat">准备就绪</span>
        <span class="chip dim">编辑即自动预览</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="把正文粘贴到这里，然后点击「套用小说模式」。"></textarea>
    </section>

    <section class="panel">
      <div class="panel-bar">
        <strong>排版预览</strong>
        <span class="chip dim">段首缩进 · 段距加宽</span>
      </div>
      <article id="preview" class="preview"></article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
