name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Android build target'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
      skip_tests:
        description: 'Skip analyze and tests'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Android ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        if: ${{ inputs.skip_tests != true }}
        run: flutter analyze

      - name: Test
        if: ${{ inputs.skip_tests != true }}
        run: flutter test

      - name: Build APK
        if: ${{ inputs.target == 'apk' }}
        run: flutter build apk --release

      - name: Build App Bundle
        if: ${{ inputs.target == 'appbundle' }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ inputs.target == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: vellum-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.target == 'appbundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: vellum-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
